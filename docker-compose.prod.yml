version: "3.9"

# Production-style overlay: serves the frontend as a static Nginx build
# (see frontend/Dockerfile's `prod` stage + frontend/nginx.conf) instead of
# the Vite dev server. Nginx forwards /api/* to the backend container.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "5174:80"
