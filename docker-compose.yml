version: "3.9"

services:
  backend:
    build: ./backend
    container_name: hoops-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - SQLITE_PATH=/data/hoops.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: hoops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
