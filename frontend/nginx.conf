worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static app shell / assets (built by `vite build`).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Forward /api/* to the FastAPI backend, stripping the /api prefix
        # so the backend keeps its existing routes (e.g. /api/players ->
        # http://backend:8000/players). This lets any device on the LAN
        # reach the API through the same host/port as the frontend.
        #
        # Both "/api" (no trailing slash) and "/api/..." are covered: the
        # exact-match block redirects the former to the latter so every API
        # request is proxied to FastAPI and never falls through to the SPA's
        # `try_files ... /index.html` fallback above. $http_host (not just
        # $host) preserves the original port so this works from any device/IP.
        location = /api {
            return 308 $scheme://$http_host/api/;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
